name: Build IPA
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Cài XcodeGen
        run: brew install xcodegen

      - name: Sinh project
        run: xcodegen generate

      - name: Build (không ký)
        run: |
          xcodebuild -project PhotoStyles.xcodeproj -scheme PhotoStyles \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            clean build

      - name: Đóng gói IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/PhotoStyles.app Payload/
          zip -qry PhotoStyles.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoStyles-ipa
          path: PhotoStyles.ipa
